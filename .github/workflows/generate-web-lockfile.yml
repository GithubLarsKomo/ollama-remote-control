name: generate-web-lockfile

on:
  pull_request:
    paths:
      - 'apps/web/package.json'
      - 'package.json'
      - '.github/workflows/generate-web-lockfile.yml'

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/wave-2-web-foundation'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - name: Resolve package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Audit resolved dependency graph
        run: npm audit --audit-level=high

      - name: Commit generated lockfile only
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already matches package manifests.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Update npm lockfile for web workspace'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
