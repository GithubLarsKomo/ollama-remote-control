name: beta-release-candidate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  release-evidence:
    name: beta-release-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout tested ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve authoritative release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -er '.version' release/version.json)"
          node_version="$(jq -er '.nodeVersion' release/version.json)"
          npm_version="$(jq -er '.npmVersion' release/version.json)"
          [[ "$version" =~ ^0\.1\.0-beta\.[1-9][0-9]*$ ]]
          [[ "$node_version" =~ ^24\.[0-9]+\.[0-9]+$ ]]
          [[ "$npm_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'version=%s\nnode_version=%s\nnpm_version=%s\n' "$version" "$node_version" "$npm_version" >> "$GITHUB_OUTPUT"

      - name: Set up exact release Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.release.outputs.node_version }}
          cache: npm

      - name: Resolve exact acceptance identity
        id: identity
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          if [[ ! "$tested_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'Unable to resolve exact tested commit SHA.' >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            lookup_sha="${PR_HEAD_SHA}"
            sibling_event='pull_request'
          else
            lookup_sha="${GITHUB_SHA}"
            sibling_event='workflow_dispatch'
          fi
          printf 'tested_sha=%s\nlookup_sha=%s\nsibling_event=%s\n' "$tested_sha" "$lookup_sha" "$sibling_event" >> "$GITHUB_OUTPUT"

      - name: Dispatch fresh release gates for manual candidate
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run foundation-spike.yml --ref "$GITHUB_REF_NAME"
          gh workflow run production-container.yml --ref "$GITHUB_REF_NAME"

      - name: Require successful release gates for exact source SHA
        id: gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LOOKUP_SHA: ${{ steps.identity.outputs.lookup_sha }}
          REPOSITORY: ${{ github.repository }}
          SIBLING_EVENT: ${{ steps.identity.outputs.sibling_event }}
        run: |
          set -euo pipefail
          required=(foundation-spike production-container)
          api="https://api.github.com/repos/${REPOSITORY}/actions/runs?head_sha=${LOOKUP_SHA}&event=${SIBLING_EVENT}&per_page=100"

          for attempt in $(seq 1 75); do
            payload="$(curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api")"
            all_green=1
            foundation_run_id=''
            for workflow in "${required[@]}"; do
              row="$(jq -c --arg name "$workflow" '[.workflow_runs[] | select(.name == $name)] | sort_by(.run_number) | reverse | .[0] // null' <<<"$payload")"
              if [[ "$row" == "null" ]]; then
                echo "${workflow}: not started yet"
                all_green=0
                continue
              fi
              status="$(jq -r '.status' <<<"$row")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$row")"
              echo "${workflow}: status=${status} conclusion=${conclusion:-pending}"
              if [[ "$workflow" == 'foundation-spike' ]]; then
                foundation_run_id="$(jq -r '.id' <<<"$row")"
              fi
              if [[ "$status" == "completed" && "$conclusion" != "success" ]]; then
                echo "Required workflow ${workflow} completed with ${conclusion:-unknown}; release acceptance fails closed." >&2
                exit 1
              fi
              if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
                all_green=0
              fi
            done
            if [[ "$all_green" == 1 ]]; then
              if [[ ! "$foundation_run_id" =~ ^[0-9]+$ ]]; then
                echo 'Unable to bind release evidence to the successful foundation run.' >&2
                exit 1
              fi
              printf 'foundation_run_id=%s\n' "$foundation_run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$attempt" == 75 ]]; then
              echo 'Timed out waiting for exact-SHA release gates; release acceptance fails closed.' >&2
              exit 1
            fi
            sleep 15
          done

      - name: Require exact-SHA bounded RC scenario evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FOUNDATION_RUN_ID: ${{ steps.gates.outputs.foundation_run_id }}
          REPOSITORY: ${{ github.repository }}
          TESTED_SHA: ${{ steps.identity.outputs.tested_sha }}
        run: |
          set -euo pipefail
          expected_name="beta-rc-scenarios-${TESTED_SHA}"
          artifacts="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/actions/runs/${FOUNDATION_RUN_ID}/artifacts?per_page=100")"
          row="$(jq -c --arg name "$expected_name" '[.artifacts[] | select(.name == $name and .expired == false)] | .[0] // null' <<<"$artifacts")"
          if [[ "$row" == 'null' ]]; then
            echo "Required RC scenario artifact ${expected_name} is missing or expired." >&2
            exit 1
          fi
          artifact_id="$(jq -r '.id' <<<"$row")"
          if [[ ! "$artifact_id" =~ ^[0-9]+$ ]]; then
            echo 'RC scenario artifact identity is invalid.' >&2
            exit 1
          fi
          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            --output "$RUNNER_TEMP/beta-rc-scenarios.zip"
          mkdir "$RUNNER_TEMP/beta-rc-scenarios"
          unzip -q "$RUNNER_TEMP/beta-rc-scenarios.zip" -d "$RUNNER_TEMP/beta-rc-scenarios"
          evidence="$RUNNER_TEMP/beta-rc-scenarios/beta-rc-scenarios.json"
          test -f "$evidence"
          node --input-type=module - "$evidence" "$TESTED_SHA" <<'NODE'
          import fs from 'node:fs';
          const [path, expectedSha] = process.argv.slice(2);
          const evidence = JSON.parse(fs.readFileSync(path, 'utf8'));
          const expectedIds = new Set([
            'identity-target-onboarding',
            'model-runtime-smoke',
            'pull-reconnect-recovery',
            'modelfile-deploy-lineage',
            'container-audit-safety',
            'restart-update-rollback',
            'mutation-failure-recovery-matrix',
            'application-state-backup-restore',
            'browser-reconnect-surfaces',
          ]);
          if (evidence?.schemaVersion !== 1 || evidence?.commitSha !== expectedSha || evidence?.overall !== 'passed') {
            throw new Error('RC scenario evidence does not match the exact tested candidate.');
          }
          if (!Array.isArray(evidence.scenarios) || evidence.scenarios.length !== expectedIds.size) {
            throw new Error('RC scenario evidence has an unexpected scenario set.');
          }
          for (const scenario of evidence.scenarios) {
            if (!expectedIds.delete(scenario?.id) || scenario?.status !== 'passed') {
              throw new Error('RC scenario evidence contains missing, duplicate or failed scenarios.');
            }
          }
          if (expectedIds.size !== 0) throw new Error('RC scenario evidence is incomplete.');
          NODE

      - name: Build exact-SHA release package
        id: package
        shell: bash
        env:
          TESTED_SHA: ${{ steps.identity.outputs.tested_sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          NPM_VERSION: ${{ steps.release.outputs.npm_version }}
          NODE_VERSION: ${{ steps.release.outputs.node_version }}
        run: |
          set -euo pipefail
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"
          npm ci --ignore-scripts=false
          npm run build
          test -z "$(git status --porcelain --untracked-files=normal)"

          base_tag='node:24-bookworm-slim'
          docker pull "$base_tag"
          base_ref="$(docker image inspect -f '{{index .RepoDigests 0}}' "$base_tag")"
          base_id="$(docker image inspect -f '{{.Id}}' "$base_tag")"
          [[ "$base_ref" == node@sha256:* ]]
          [[ "$base_id" =~ ^sha256:[a-f0-9]{64}$ ]]

          image_ref="ollama-remote-control:${RELEASE_VERSION}-${TESTED_SHA:0:12}"
          docker build \
            --build-arg "NODE_IMAGE=${base_ref}" \
            --build-arg "ORC_VERSION=${RELEASE_VERSION}" \
            --build-arg "ORC_COMMIT_SHA=${TESTED_SHA}" \
            -t "$image_ref" .
          image_id="$(docker image inspect -f '{{.Id}}' "$image_ref")"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image_ref")" = "$RELEASE_VERSION"
          test "$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_ref")" = "$TESTED_SHA"
          test "$(docker run --rm --entrypoint node "$image_ref" --version)" = "v${NODE_VERSION}"

          out="$RUNNER_TEMP/release-package"
          npm run release:package -- \
            --out "$out" \
            --commit "$TESTED_SHA" \
            --image-reference "$image_ref" \
            --image-id "$image_id" \
            --base-image-reference "$base_ref" \
            --base-image-id "$base_id"
          (cd "$out" && sha256sum -c SHA256SUMS)
          jq -e \
            --arg version "$RELEASE_VERSION" \
            --arg sha "$TESTED_SHA" \
            --arg image "$image_id" \
            --arg base "$base_ref" \
            '.schemaVersion == 1
             and .releaseVersion == $version
             and .commitSha == $sha
             and .image.id == $image
             and .inputs.baseImageReference == $base
             and (.workspaces | length == 8)
             and ([.workspaces[].releaseVersion] | all(. == $version))' \
            "$out/release-manifest.json" >/dev/null
          printf 'image_ref=%s\nimage_id=%s\nbase_ref=%s\n' "$image_ref" "$image_id" "$base_ref" >> "$GITHUB_OUTPUT"

      - name: Write bounded release evidence
        shell: bash
        env:
          TESTED_SHA: ${{ steps.identity.outputs.tested_sha }}
        run: |
          set -euo pipefail
          node scripts/beta-rc-evidence.mjs \
            "$RUNNER_TEMP/beta-rc-evidence.json" \
            "$TESTED_SHA" \
            foundation-spike=passed \
            production-container=passed \
            exact-commit-binding=passed \
            rc-scenarios=passed \
            release-packaging=passed
          cat "$RUNNER_TEMP/beta-rc-evidence.json" >> "$GITHUB_STEP_SUMMARY"
          jq . "$RUNNER_TEMP/release-package/release-manifest.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta-rc-evidence-${{ steps.identity.outputs.tested_sha }}
          path: ${{ runner.temp }}/beta-rc-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact-SHA release package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orc-${{ steps.release.outputs.version }}-${{ steps.identity.outputs.tested_sha }}
          path: ${{ runner.temp }}/release-package
          if-no-files-found: error
          retention-days: 30