name: foundation-spike

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          check-latest: true
          cache: npm

      - name: Install disposable SSH server and remote fixtures
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x /usr/sbin/sshd ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends openssh-server
          fi
          sudo ssh-keygen -A

          sudo useradd -m -s /bin/bash orcspike
          sudo passwd -d orcspike
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/orc_spike_key"
          sudo install -d -m 700 -o orcspike -g orcspike /home/orcspike/.ssh
          sudo install -m 600 -o orcspike -g orcspike "$RUNNER_TEMP/orc_spike_key.pub" /home/orcspike/.ssh/authorized_keys
          sudo mkdir -p /run/sshd
          cat > "$RUNNER_TEMP/sshd_config" <<'EOF'
          Port 2222
          ListenAddress 127.0.0.1
          HostKey /etc/ssh/ssh_host_ed25519_key
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
          UsePAM no
          AllowUsers orcspike
          AllowTcpForwarding yes
          PermitTTY yes
          AuthorizedKeysFile .ssh/authorized_keys
          Subsystem sftp internal-sftp
          PidFile /tmp/orc-spike-sshd.pid
          EOF
          sudo /usr/sbin/sshd -f "$RUNNER_TEMP/sshd_config" -E "$RUNNER_TEMP/orc-spike-sshd.log"

          sudo touch \
            /tmp/orc-docker-calls \
            /tmp/orc-docker-fixture-mode \
            /tmp/orc-status-fixture-mode \
            /tmp/orc-system-calls \
            /tmp/orc-log-state \
            /tmp/orc-log-pid \
            /tmp/orc-container-state \
            /tmp/orc-lifecycle-mode \
            /tmp/orc-registry-mode \
            /tmp/orc-compose-mode \
            /tmp/orc-compose-stdin
          sudo chmod 666 \
            /tmp/orc-docker-calls \
            /tmp/orc-docker-fixture-mode \
            /tmp/orc-status-fixture-mode \
            /tmp/orc-system-calls \
            /tmp/orc-log-state \
            /tmp/orc-log-pid \
            /tmp/orc-container-state \
            /tmp/orc-lifecycle-mode \
            /tmp/orc-registry-mode \
            /tmp/orc-compose-mode \
            /tmp/orc-compose-stdin
          printf 'single' > /tmp/orc-docker-fixture-mode
          printf 'normal' > /tmp/orc-status-fixture-mode
          printf 'running' > /tmp/orc-container-state
          printf 'normal' > /tmp/orc-lifecycle-mode
          printf 'changed' > /tmp/orc-registry-mode
          printf 'normal' > /tmp/orc-compose-mode
          : > /tmp/orc-log-state
          : > /tmp/orc-log-pid
          : > /tmp/orc-compose-stdin

          sudo tee /usr/local/bin/docker >/dev/null <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          printf '%s\n' "$*" >> /tmp/orc-docker-calls
          mode="$(cat /tmp/orc-docker-fixture-mode 2>/dev/null || printf single)"
          status_mode="$(cat /tmp/orc-status-fixture-mode 2>/dev/null || printf normal)"
          lifecycle_mode="$(cat /tmp/orc-lifecycle-mode 2>/dev/null || printf normal)"
          registry_mode="$(cat /tmp/orc-registry-mode 2>/dev/null || printf changed)"
          compose_mode="$(cat /tmp/orc-compose-mode 2>/dev/null || printf normal)"
          container_state="$(cat /tmp/orc-container-state 2>/dev/null || printf running)"
          case "${1:-}" in
            version)
              printf '27.5.1\n'
              ;;
            ps)
              if [[ "$mode" == "ambiguous" ]]; then
                printf '%s\n' \
                  '{"ID":"ollama-container-a","Names":"ollama-a","Image":"ollama/ollama:latest","State":"running","Status":"Up","Ports":"11434/tcp","Labels":""}' \
                  '{"ID":"ollama-container-b","Names":"ollama-b","Image":"ollama/ollama:latest","State":"exited","Status":"Exited","Ports":"11434/tcp","Labels":""}'
              else
                printf '%s\n' \
                  '{"ID":"ollama-container-id","Names":"ollama","Image":"ollama/ollama:latest","State":"running","Status":"Up 1 hour","Ports":"127.0.0.1:11434->11434/tcp","Labels":"com.docker.compose.service=ollama"}' \
                  '{"ID":"database-id","Names":"database","Image":"mariadb:11","State":"running","Status":"Up","Ports":"3306/tcp","Labels":""}'
              fi
              ;;
            inspect)
              id="${2:-}"
              if [[ "$mode" == "missing-selected" && "$id" == "ollama-container-id" ]]; then
                printf 'Error: No such object: %s\n' "$id" >&2
                exit 1
              fi
              running=true
              state_status=running
              health=healthy
              started_at='2026-08-08T09:00:00.000000000Z'
              if [[ "$id" == "ollama-container-b" ]]; then
                running=false
                state_status=exited
                health=none
                started_at='2026-08-08T06:00:00.000000000Z'
              elif [[ "$id" == "ollama-container-id" && "$container_state" == "stopped" ]]; then
                running=false
                state_status=exited
                health=none
                started_at='2026-08-08T06:00:00.000000000Z'
              fi
              printf '[{"Id":"%s","Name":"/%s","Image":"sha256:image-current","RestartCount":2,"Config":{"Image":"ollama/ollama:latest","Env":["OLLAMA_HOST=0.0.0.0:11434","OLLAMA_API_KEY=top-secret"],"Labels":{"com.docker.compose.project":"orc-stack","com.docker.compose.service":"ollama","com.docker.compose.project.config_files":"/srv/orc/compose.yml","com.docker.compose.project.working_dir":"/srv/orc"}},"State":{"Running":%s,"Status":"%s","StartedAt":"%s","OOMKilled":false,"Health":{"Status":"%s"}},"Mounts":[{"Source":"/srv/ollama","Destination":"/root/.ollama","Type":"bind"}],"HostConfig":{"PortBindings":{"11434/tcp":[{"HostIp":"127.0.0.1","HostPort":"11434"}]},"RestartPolicy":{"Name":"unless-stopped"},"NetworkMode":"orc_default","Devices":[],"DeviceRequests":[{"Driver":"nvidia","Count":-1,"Capabilities":[["gpu"]]}]},"NetworkSettings":{"Networks":{"orc_default":{"Aliases":["ollama"]}}}}]\n' "$id" "${id/ollama-container-id/ollama}" "$running" "$state_status" "$started_at" "$health"
              ;;
            image)
              if [[ "${2:-}" != "inspect" || "${3:-}" != "ollama/ollama:latest" ]]; then
                printf 'unsupported fake docker image command\n' >&2
                exit 64
              fi
              printf '[{"Id":"sha256:image-current","RepoTags":["ollama/ollama:latest"],"RepoDigests":["ollama/ollama@sha256:current-digest"],"Architecture":"amd64","Os":"linux","Variant":"","Config":{"Env":["IMAGE_DEFAULT=value"]}}]\n'
              ;;
            compose)
              if [[ "$compose_mode" == "unavailable" ]]; then
                printf 'docker: compose unavailable secret=COMPOSE-SECRET\n' >&2
                exit 1
              fi
              if [[ "${2:-}" == "version" && "${3:-}" == "--short" ]]; then
                printf '2.40.3\n'
                exit 0
              fi
              if [[ "${2:-}" != "-p" || "${3:-}" != "orc-stack" || "${4:-}" != "--project-directory" || "${5:-}" != "/srv/orc" || "${6:-}" != "-f" || "${7:-}" != "/srv/orc/compose.yml" ]]; then
                printf 'unexpected compose context\n' >&2
                exit 64
              fi
              if [[ "${8:-}" == "config" && "${9:-}" == "--services" ]]; then
                if [[ "$compose_mode" == "config-fail" ]]; then
                  printf 'compose config failed secret=COMPOSE-SECRET\n' >&2
                  exit 1
                fi
                if [[ "$compose_mode" == "service-missing" ]]; then
                  printf 'database\n'
                else
                  printf 'ollama\ndatabase\n'
                fi
                exit 0
              fi
              if [[ "${8:-}" == "ps" && "${9:-}" == "--all" && "${10:-}" == "-q" && "${11:-}" == "ollama" ]]; then
                if [[ "$compose_mode" == "mismatch" ]]; then
                  printf 'different-container-id\n'
                else
                  printf 'ollama-container-id\n'
                fi
                exit 0
              fi
              if [[ "${8:-}" == "-f" && "${9:-}" == "-" && "${10:-}" == "config" && "${11:-}" == "--images" && "${12:-}" == "ollama" ]]; then
                override="$(cat)"
                printf '%s' "$override" > /tmp/orc-compose-stdin
                expected_image='ollama/ollama@sha256:candidate-digest'
                if [[ "$registry_mode" == "intent-changed" ]]; then
                  expected_image='ollama/ollama@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
                fi
                expected_json="{\"services\":{\"ollama\":{\"image\":\"${expected_image}\"}}}"
                if [[ "$override" != "$expected_json" ]]; then
                  printf 'unexpected compose stdin override\n' >&2
                  exit 64
                fi
                if [[ "$compose_mode" == "pin-fail" ]]; then
                  printf 'compose pin validation failed secret=COMPOSE-PIN-SECRET\n' >&2
                  exit 1
                fi
                if [[ "$compose_mode" == "pin-mismatch" ]]; then
                  printf 'ollama/ollama@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb\n'
                else
                  printf '%s\n' "$expected_image"
                fi
                exit 0
              fi
              printf 'unsupported fake compose command\n' >&2
              exit 64
              ;;
            buildx)
              if [[ "$registry_mode" == "buildx-missing" ]]; then
                printf 'docker: buildx is not a docker command; secret=REGISTRY-SECRET\n' >&2
                exit 1
              fi
              if [[ "${2:-}" == "version" ]]; then
                printf 'github.com/docker/buildx v0.30.1\n'
                exit 0
              fi
              if [[ "${2:-}" != "imagetools" || "${3:-}" != "inspect" || -z "${4:-}" || "${5:-}" != "--format" ]]; then
                printf 'unsupported fake docker buildx arguments\n' >&2
                exit 64
              fi
              if [[ "$registry_mode" == "registry-fail" ]]; then
                printf 'registry authorization failed token=REGISTRY-SECRET\n' >&2
                exit 1
              fi
              reference="${4:-}"
              format="${6:-}"
              if [[ "$format" == '{{json .Manifest}}' ]]; then
                if [[ "$reference" != "ollama/ollama:latest" ]]; then
                  printf 'unexpected manifest reference\n' >&2
                  exit 64
                fi
                if [[ "$registry_mode" == "platform-missing" ]]; then
                  printf '{"schemaVersion":2,"mediaType":"application/vnd.oci.image.index.v1+json","digest":"sha256:index-digest","manifests":[{"digest":"sha256:arm64-digest","platform":{"os":"linux","architecture":"arm64"}}]}\n'
                else
                  candidate_digest='sha256:candidate-digest'
                  [[ "$registry_mode" == "same" ]] && candidate_digest='sha256:current-digest'
                  [[ "$registry_mode" == "intent-changed" ]] && candidate_digest='sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
                  printf '{"schemaVersion":2,"mediaType":"application/vnd.oci.image.index.v1+json","digest":"sha256:index-digest","manifests":[{"digest":"%s","platform":{"os":"linux","architecture":"amd64"}},{"digest":"sha256:arm64-digest","platform":{"os":"linux","architecture":"arm64"}}]}\n' "$candidate_digest"
                fi
                exit 0
              fi
              if [[ "$format" == '{{json .Image}}' ]]; then
                expected='ollama/ollama@sha256:candidate-digest'
                [[ "$registry_mode" == "same" ]] && expected='ollama/ollama@sha256:current-digest'
                [[ "$registry_mode" == "intent-changed" ]] && expected='ollama/ollama@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
                if [[ "$reference" != "$expected" ]]; then
                  printf 'unexpected image reference\n' >&2
                  exit 64
                fi
                printf '{"architecture":"amd64","os":"linux","config":{"Labels":{"org.opencontainers.image.version":"0.33.0"}}}\n'
                exit 0
              fi
              printf 'unsupported fake buildx format\n' >&2
              exit 64
              ;;
            start|stop|restart)
              action="${1:-}"
              id="${2:-}"
              if [[ "$id" != "ollama-container-id" ]]; then
                printf 'Error: No such container: %s\n' "$id" >&2
                exit 1
              fi
              if [[ "$lifecycle_mode" == "command-fail" ]]; then
                printf 'daemon rejected secret=REMOTE-TOP-SECRET\n' >&2
                exit 125
              fi
              if [[ "$lifecycle_mode" == "slow" ]]; then
                sleep 1
              fi
              case "$action" in
                start|restart) next_state=running ;;
                stop) next_state=stopped ;;
              esac
              if [[ "$lifecycle_mode" == "verification-fail" ]]; then
                if [[ "$next_state" == "running" ]]; then next_state=stopped; else next_state=running; fi
              fi
              printf '%s' "$next_state" > /tmp/orc-container-state
              printf '%s\n' "$id"
              ;;
            exec)
              if [[ "$status_mode" == "degraded" ]]; then
                printf 'ollama CLI unavailable\n' >&2
                exit 1
              fi
              if [[ "${3:-}" == "ollama" && "${4:-}" == "--version" ]]; then
                printf 'ollama version is 0.32.5\n'
              else
                printf 'unsupported fake docker exec\n' >&2
                exit 64
              fi
              ;;
            logs)
              if [[ "${2:-}" != "--follow" || "${3:-}" != "--timestamps" || "${4:-}" != "--tail" || -z "${5:-}" || "${6:-}" != "ollama-container-id" ]]; then
                printf 'unsupported fake docker logs arguments\n' >&2
                exit 64
              fi
              printf '%s\n' "$$" > /tmp/orc-log-pid
              cleanup() { printf 'stopped\n' > /tmp/orc-log-state; }
              trap 'cleanup; exit 0' TERM HUP INT
              trap cleanup EXIT
              printf '2026-08-08T08:00:00Z stdout-log-line\n'
              printf '2026-08-08T08:00:01Z stderr-log-line\n' >&2
              while true; do sleep 1; done
              ;;
            *)
              printf 'unsupported fake docker command\n' >&2
              exit 64
              ;;
          esac
          EOF
          sudo chmod 755 /usr/local/bin/docker

          sudo tee /usr/local/bin/nvidia-smi >/dev/null <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          printf 'nvidia-smi %s\n' "$*" >> /tmp/orc-system-calls
          mode="$(cat /tmp/orc-status-fixture-mode 2>/dev/null || printf normal)"
          if [[ "$mode" == "degraded" ]]; then
            printf 'NVIDIA unavailable\n' >&2
            exit 1
          fi
          printf 'NVIDIA RTX A4000, 555.42, 30, 16384, 8192, 8192, 55\n'
          EOF
          sudo chmod 755 /usr/local/bin/nvidia-smi

          sudo tee /usr/local/bin/df >/dev/null <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          printf 'df %s\n' "$*" >> /tmp/orc-system-calls
          mode="$(cat /tmp/orc-status-fixture-mode 2>/dev/null || printf normal)"
          if [[ "$mode" == "degraded" ]]; then
            printf 'permission denied\n' >&2
            exit 1
          fi
          printf 'Filesystem 1024-blocks Used Available Capacity Mounted on\n'
          printf '/dev/fake 1000000 400000 600000 40%% /srv/ollama\n'
          EOF
          sudo chmod 755 /usr/local/bin/df

      - name: Install locked dependencies
        run: npm ci --ignore-scripts=false

      - name: Build product
        run: npm run build

      - name: Test product
        env:
          SSH_HOST: 127.0.0.1
          SSH_PORT: '2222'
          SSH_USER: orcspike
          SSH_PRIVATE_KEY_PATH: ${{ runner.temp }}/orc_spike_key
          ORC_DOCKER_FIXTURE_LOG: /tmp/orc-docker-calls
          ORC_SYSTEM_FIXTURE_LOG: /tmp/orc-system-calls
          ORC_LOG_PROCESS_STATE: /tmp/orc-log-state
          ORC_LOG_PROCESS_PID: /tmp/orc-log-pid
          ORC_CONTAINER_STATE: /tmp/orc-container-state
          ORC_LIFECYCLE_MODE: /tmp/orc-lifecycle-mode
          ORC_REGISTRY_MODE: /tmp/orc-registry-mode
          ORC_COMPOSE_MODE: /tmp/orc-compose-mode
          ORC_COMPOSE_STDIN: /tmp/orc-compose-stdin
        run: npm test

      - name: Run bounded beta RC scenarios in disposable fixture
        env:
          SSH_HOST: 127.0.0.1
          SSH_PORT: '2222'
          SSH_USER: orcspike
          SSH_PRIVATE_KEY_PATH: ${{ runner.temp }}/orc_spike_key
          ORC_DOCKER_FIXTURE_LOG: /tmp/orc-docker-calls
          ORC_SYSTEM_FIXTURE_LOG: /tmp/orc-system-calls
          ORC_LOG_PROCESS_STATE: /tmp/orc-log-state
          ORC_LOG_PROCESS_PID: /tmp/orc-log-pid
          ORC_CONTAINER_STATE: /tmp/orc-container-state
          ORC_LIFECYCLE_MODE: /tmp/orc-lifecycle-mode
          ORC_REGISTRY_MODE: /tmp/orc-registry-mode
          ORC_COMPOSE_MODE: /tmp/orc-compose-mode
          ORC_COMPOSE_STDIN: /tmp/orc-compose-stdin
        run: node scripts/beta-rc-scenarios.mjs "$RUNNER_TEMP/beta-rc-scenarios.json" "$GITHUB_SHA"

      - name: Upload bounded beta RC scenario evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta-rc-scenarios-${{ github.sha }}
          path: ${{ runner.temp }}/beta-rc-scenarios.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove remote fixtures
        run: sudo rm -f /usr/local/bin/docker /usr/local/bin/nvidia-smi /usr/local/bin/df

      - name: Run compatibility gates
        env:
          SSH_HOST: 127.0.0.1
          SSH_PORT: '2222'
          SSH_USER: orcspike
          SSH_PRIVATE_KEY_PATH: ${{ runner.temp }}/orc_spike_key
        run: npm run spike:foundation

      - name: Build deployment-base Docker image
        run: /usr/bin/docker build --pull -f spikes/foundation/Dockerfile -t ollama-remote-control:foundation-spike .