name: beta-acceptance

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  beta-acceptance:
    name: beta-acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Require successful merge-ref release gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          required=(foundation-spike production-container)
          api="https://api.github.com/repos/${REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100"

          for attempt in $(seq 1 75); do
            payload="$(curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api")"

            all_green=1
            for workflow in "${required[@]}"; do
              row="$(jq -c --arg name "$workflow" '[.workflow_runs[] | select(.name == $name)] | sort_by(.run_number) | reverse | .[0] // null' <<<"$payload")"
              if [[ "$row" == "null" ]]; then
                echo "${workflow}: not started yet"
                all_green=0
                continue
              fi

              status="$(jq -r '.status' <<<"$row")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$row")"
              url="$(jq -r '.html_url' <<<"$row")"
              echo "${workflow}: status=${status} conclusion=${conclusion:-pending} ${url}"

              if [[ "$status" == "completed" && "$conclusion" != "success" ]]; then
                echo "Required workflow ${workflow} completed with ${conclusion:-unknown}; beta acceptance fails closed." >&2
                exit 1
              fi

              if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
                all_green=0
              fi
            done

            if [[ "$all_green" == 1 ]]; then
              echo 'All required merge-ref release gates succeeded.'
              exit 0
            fi

            if [[ "$attempt" == 75 ]]; then
              echo 'Timed out waiting for required merge-ref release gates; beta acceptance fails closed.' >&2
              exit 1
            fi
            sleep 15
          done
